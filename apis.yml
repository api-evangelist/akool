  description: Generate an expressive, speaking avatar video from an Akool or
    user-supplied avatar plus text or an audio track. Create a task with POST
    /api/open/v3/talkingavatar/create using an avatar_id, voice_id, and input_text
    (or a pre-generated audio url), then poll by _id until video_status is
    completed. Strong fit for the "AI avatars" and "video generation" use cases.
- aid: akool:akool-talking-photo-api
  name: Akool Talking Photo API
  tags:
  - AI Avatars
  - Talking Photo
  - Video Generation
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.akool.com/ai-tools-suite/talking-photo
  baseURL: https://openapi.akool.com
  properties:
  - url: https://docs.akool.com/ai-tools-suite/talking-photo
    type: Documentation
  - url: https://docs.akool.com/ai-tools-suite/talking-photo/create-video
    type: APIReference
  - url: openapi/akool-openapi.yml
    type: OpenAPI
  - url: collections/akool.postman_collection.json
    type: PostmanCollection
  - url: collections/akool.opencollection.json
    type: OpenCollection
  description: Turn a still portrait into a talking video by pairing a
    talking_photo_url with an audio_url. Create with POST
    /api/open/v3/content/video/createbytalkingphoto (optional prompt for gestures,
    720p or 1080p resolution, webhookUrl), then poll status with GET
    /api/open/v3/content/video/infobymodelid.
- aid: akool:akool-face-swap-api
  name: Akool Face Swap API
  tags:
  - Face Swap
  - AI Video
  - Generative AI
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.akool.com/ai-tools-suite/faceswap
  baseURL: https://openapi.akool.com
