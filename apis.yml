aid: akool
url: https://raw.githubusercontent.com/api-evangelist/akool/refs/heads/main/apis.yml
name: Akool
kind: company
description: Akool is a generative AI platform for video and imagery - talking
  avatars, talking photos, face swap, video translation with lip-sync, background
  change, image generation, and a real-time streaming (live) avatar product. The
  Akool OpenAPI exposes these tools as an HTTPS REST API under
  https://openapi.akool.com, authenticated with a Bearer token minted from a
  clientId / clientSecret pair (or a direct x-api-key). Generation is asynchronous -
  callers create a task, then poll by id or receive an encrypted webhook callback
  when the task completes. The Live Avatar product opens a real-time session whose
  media is carried over a third-party WebRTC transport (Agora, LiveKit, or TRTC).
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
