    type: Documentation
    note: AI Tools Suite index; lists all products and links llms.txt and published OpenAPI files.
  - url: https://docs.akool.com/authentication/usage
    type: Documentation
    note: Token via POST /api/open/v3/getToken from clientId/clientSecret, or direct x-api-key; base https://openapi.akool.com/api/. All REST.
  - url: https://docs.akool.com/ai-tools-suite/talking-avatar
    type: APIReference
    note: POST /api/open/v3/talkingavatar/create; poll by _id. REST.
  - url: https://docs.akool.com/ai-tools-suite/talking-photo/create-video
    type: APIReference
    note: POST /api/open/v3/content/video/createbytalkingphoto; poll /content/video/infobymodelid. REST.
  - url: https://docs.akool.com/ai-tools-suite/faceswap/faceswap-plus
    type: APIReference
    note: POST /api/open/v4/faceswap/faceswapPlusByImage; results /faceswap/result/listbyids. REST + webhook.
  - url: https://docs.akool.com/ai-tools-suite/video-translation/create-translation
    type: APIReference
    note: POST /api/open/v3/content/video/createbytranslate; languages /language/list. REST.
  - url: https://docs.akool.com/ai-tools-suite/image-generate/create-by-source-prompt
    type: APIReference
    note: POST /api/open/v4/content/image/createBySourcePrompt; poll /content/image/infobymodelid. REST.
  - url: https://docs.akool.com/ai-tools-suite/live-avatar/create-session
    type: APIReference
    note: POST /api/open/v4/liveAvatar/session/create; stream_type agora/livekit/trtc; caller supplies WebRTC credentials. No Akool WebSocket.
  - url: https://docs.akool.com/implementation-guide/streaming-avatar
    type: Documentation
    note: Three WebRTC SDK options (Agora, LiveKit, TRTC); no proprietary Akool WebSocket transport.
  - url: https://docs.akool.com/ai-tools-suite/webhook
    type: Documentation
    note: Encrypted webhook callback (dataEncrypt AES-256-CBC, SHA-1 signature) on task completion. HTTP callback, not WebSocket.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No Akool-operated WebSocket protocol surface exists. Akool's own public API
    is request/response REST (create-then-poll) with an outbound encrypted
    webhook. The only real-time product, Live Avatar, delegates its media
    stream to a caller-selected third-party WebRTC transport (Agora, LiveKit, or
    TRTC) rather than a documented Akool WebSocket, so no AsyncAPI document was
    authored - there is no Akool-owned message channel to model.
