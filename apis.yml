    /api/open/v3/content/image/infobymodelid.
- aid: akool:akool-live-avatar-api
  name: Akool Live Avatar (Streaming) API
  tags:
  - AI Avatars
  - Live Avatar
  - Real Time
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.akool.com/ai-tools-suite/live-avatar
  baseURL: https://openapi.akool.com
  properties:
  - url: https://docs.akool.com/ai-tools-suite/live-avatar
    type: Documentation
  - url: https://docs.akool.com/ai-tools-suite/live-avatar/create-session
    type: APIReference
  - url: openapi/akool-openapi.yml
    type: OpenAPI
  - url: https://docs.akool.com/openapi/live-avatar.yaml
    type: OpenAPI
  - url: collections/akool.postman_collection.json
    type: PostmanCollection
  - url: collections/akool.opencollection.json
    type: OpenCollection
  description: Real-time, interactive streaming avatars. The REST control plane
    lists avatars (GET /api/open/v4/liveAvatar/avatar/list) and manages sessions
    (create, list, detail, close). Session media is NOT a documented Akool
    WebSocket - it is carried over a caller-selected third-party WebRTC transport
    (stream_type agora, livekit, or trtc) whose credentials you pass on
    POST /api/open/v4/liveAvatar/session/create.
