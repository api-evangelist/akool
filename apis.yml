  description: Translate a source video into one or more target languages with
    optional lip-sync, speaker detection, background-music removal, and caption
    handling. List supported languages with GET /api/open/v3/language/list, create
    with POST /api/open/v3/content/video/createbytranslate, then poll by _id until
    video_status is completed.
