    type: APIReference
  - url: openapi/akool-openapi.yml
    type: OpenAPI
  - url: collections/akool.postman_collection.json
    type: PostmanCollection
  - url: collections/akool.opencollection.json
    type: OpenCollection
  description: Swap a source face onto a target image or video, single-face or
    multi-face via a face_mapping array, with model_style and face_enhance options.
    Create with POST /api/open/v4/faceswap/faceswapPlusByImage, retrieve results
    with GET /api/open/v3/faceswap/result/listbyids. Video jobs are asynchronous
    (poll or webhook).
