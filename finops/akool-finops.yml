meters:
- name: credits_consumed
  description: Credits deducted per generation, varying by product and output settings (resolution, length).
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - product
  - resolution
- name: subscription_seats
  description: Monthly or annual seat subscription that includes a base credit allowance.
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - plan
- name: credit_packs
  description: Additional pay-as-you-go credit packs purchased above the included allowance.
  unit: credits
  aggregation: sum
  dimensions:
  - account
- name: concurrent_generations
  description: Concurrent-job ceiling per plan; higher concurrency is a paid capability rather than a metered charge.
  unit: jobs
  aggregation: max
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: Track credits consumed per product and per output setting; watch resolution and length, which drive per-job credit cost.
- name: Allocation
  description: Map credit consumption to teams/workloads by tagging generation jobs at the application layer, since Akool bills at the account level.
- name: Optimization
  description: Generate at the lowest acceptable resolution and length, batch image requests, prefer webhooks over tight polling, and buy credits at the tier with the lowest per-credit cost (Business) for steady volume.
- name: Accountability
  description: Assign an owner for the Akool account, monitor monthly credit burn against the included allowance, and re-download assets before the 7-day retention window closes.
