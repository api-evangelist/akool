description: >-
  FinOps view of Akool spend. Akool bills on a subscription-plus-credit model:
  a monthly (or annual, for Enterprise) seat subscription includes a credit
  allowance, and every generation - talking avatar, talking photo, face swap,
  video translation, image generation, and live avatar streaming - deducts
  credits at a per-operation rate that scales with output settings such as
  resolution and length. Beyond the included allowance, Pro and Pro Max buy
  additional credit packs pay-as-you-go, Business gets the lowest per-credit
  cost, and Enterprise credits do not expire. The dominant cost driver is credit
  consumption per generated asset; the API itself carries no separate
  transaction fee beyond the credits each job spends.
notes: >-
  Per-unit credit rates and seat prices are not reconciled here; verify the
  per-product credit-consumption chart and seat/credit-pack pricing on the live
  pricing and API-pricing pages. Note also that generated assets are retained
  for only 7 days, so any long-term storage cost shifts to the consumer's own
  infrastructure.
