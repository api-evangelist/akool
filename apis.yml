  name: Akool Talking Avatar API
  tags:
  - AI Avatars
  - Talking Avatar
  - Video Generation
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.akool.com/ai-tools-suite/talking-avatar
  baseURL: https://openapi.akool.com
  properties:
  - url: https://docs.akool.com/ai-tools-suite/talking-avatar
    type: Documentation
  - url: https://docs.akool.com/ai-tools-suite/talking-avatar
    type: APIReference
  - url: openapi/akool-openapi.yml
    type: OpenAPI
  - url: collections/akool.postman_collection.json
    type: PostmanCollection
  - url: collections/akool.opencollection.json
